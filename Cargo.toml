[package]
name = "mdbook-frontmatter-fix"
version = "0.3.0"
edition = "2024"
description = "A linter and fixer for mdBook projects: validates frontmatter fields, HTML structure, and broken links with clippy-style diagnostics and auto-fix"
license = "Apache-2.0"
repository = "https://github.com/saylesss88/mdbook-frontmatter-fix"
readme = "README.md"
keywords = ["mdbook", "frontmatter", "linter", "validator", "markdown"]
categories = ["command-line-utilities", "text-processing", "development-tools"]

[dependencies]
clap = {version = "4.6.6", default-features = false, features = [
	"derive",
	"std",
]}
mdbook-frontmatter-strip = "1.2.0"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = {version = "3", default-features = false}

[[bin]]
name = "fmf"
path = "src/main.rs"
